:root{color-scheme:dark;--red:#A33835;--cream:#F3EDE1;--muted:#bcb4aa}*{box-sizing:border-box}body{margin:0;background:#101010;color:var(--cream);font-family:Inter,Arial,sans-serif}header{padding:20px 5%;border-bottom:2px solid var(--red);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.brand{font-weight:900;letter-spacing:.11em;font-size:clamp(13px,2vw,22px)}.tag{color:var(--muted);font-size:12px;letter-spacing:.15em}main{max-width:1040px;margin:auto;padding:25px 20px 60px}.panel{background:#1c1c1c;border:1px solid #383838;border-radius:12px;padding:20px;margin:14px 0}h1,h2{margin:0 0 14px}h2{font-size:18px}label{display:block;color:var(--muted);font-size:13px;margin:10px 0 5px}input,select{width:100%;background:#101010;color:var(--cream);border:1px solid #595959;border-radius:6px;padding:12px;font-size:16px}button{background:var(--red);border:0;border-radius:7px;padding:13px 18px;color:white;font-weight:800;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.secondary{background:#3b3b3b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px}.buttons{display:flex;flex-wrap:wrap;gap:10px}.muted{color:var(--muted)}.notice{padding:10px 12px;border-left:3px solid var(--red);background:#292323;margin:14px 0;white-space:pre-wrap}.hidden{display:none!important}.stat{font-size:clamp(24px,4vw,42px);font-weight:900;font-variant-numeric:tabular-nums}.small{font-size:12px}.timer{font-size:clamp(90px,18vw,230px);font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.06em;line-height:1.05}.phase{font-size:clamp(28px,5vw,58px);font-weight:900;letter-spacing:.12em}.center{text-align:center}.red{color:#e47b75}.progress{height:10px;background:#393939;border-radius:8px;overflow:hidden}.progress>div{height:100%;background:var(--red);width:0%}@media(max-width:600px){header{padding:15px}main{padding:14px}.panel{padding:15px}}

</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script></head><body><header><div><div class="brand">DOWNTOWN HYBRID FITNESS CLUB</div><div class="tag">EVANSVILLE, INDIANA</div></div><div class="tag">FIRE TV TIMER</div></header><main style="max-width:none"><section class="center"><div class="muted" id="workout">CONNECTING TO DHFC...</div><div class="phase red" id="phase">WAITING</div><div class="timer" id="clock">--:--</div><div class="grid" style="max-width:850px;margin:20px auto"><div class="panel"><div class="tag">STATION</div><div class="stat" id="station">—</div></div><div class="panel"><div class="tag">ROUND</div><div class="stat" id="round">—</div></div><div class="panel"><div class="tag">TOTAL REMAINING</div><div class="stat" id="remaining">--:--</div></div></div><div class="progress"><div id="bar"></div></div><p class="muted" id="connection">Connecting...</p></section></main><script>
const db=window.supabase.createClient('https://xkcxrfnrjvyetttfcmxg.supabase.co','sb_publishable_ZaLSUzxok3aWy1xbGQyhKg_Rw8ucwd0');
const $=id=>document.getElementById(id);
const fmt=n=>{n=Math.max(0,Math.ceil(n));return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')};
function timeline(w){let out=[];const add=(phase,duration,station=0,round=0)=>{if(duration>0)out.push({phase,duration,station,round})};add('GET READY',w.preparation_seconds);if(w.kind==='countdown'){add('COUNTDOWN',w.countdown_seconds)}else{for(let s=1;s<=w.stations;s++){for(let r=1;r<=w.rounds_per_station;r++){let iv=Array.isArray(w.round_intervals)&&w.round_intervals.length?w.round_intervals[r-1]:null;add('WORK',iv?.work??w.work_seconds,s,r);add('REST',iv?.rest??w.rest_seconds,s,r)}if(s<w.stations)add('STATION BREAK',w.station_break_seconds,s,w.rounds_per_station)}add('FINISHER',w.finisher_seconds)}return out}
const total=t=>t.reduce((sum,x)=>sum+x.duration,0);
function at(t,elapsed){let start=0;for(const seg of t){if(elapsed<start+seg.duration)return {...seg,left:start+seg.duration-elapsed,offset:start};start+=seg.duration}return {phase:'COMPLETE',left:0,station:0,round:0,offset:total(t)}}
const errorMessage=e=>e?.message||String(e);
let session=null,workout=null,segments=[],offsetMs=0;let subscription=null;
async function sync(){try{const s=await db.from('dhfc_sessions').select('*').order('updated_at',{ascending:false}).limit(1).single();if(s.error)throw s.error;session=s.data;const w=await db.from('dhfc_workouts').select('*').eq('id',session.workout_id).single();if(w.error)throw w.error;workout=w.data;segments=timeline(workout);$('connection').textContent='LIVE · '+session.status.toUpperCase()}catch(e){$('connection').textContent='Connection error: '+errorMessage(e)}}
function draw(){if(!session||!workout)return;let elapsed=Number(session.elapsed_seconds);if(session.status==='running'&&session.started_at)elapsed+=Math.max(0,(Date.now()+offsetMs-new Date(session.started_at).getTime())/1000);const max=total(segments);elapsed=Math.min(max,Math.max(0,elapsed));let seg=at(segments,elapsed);$('workout').textContent=workout.name;$('phase').textContent=session.status==='idle'?'READY':session.status==='paused'?'PAUSED · '+seg.phase:seg.phase;$('clock').textContent=session.status==='idle'?fmt(max):fmt(seg.left);$('station').textContent=workout.kind==='countdown'?'—':`${seg.station||workout.stations} / ${workout.stations}`;$('round').textContent=workout.kind==='countdown'?'—':`${seg.round||workout.rounds_per_station} / ${workout.rounds_per_station}`;$('remaining').textContent=fmt(max-elapsed);$('bar').style.width=(max?elapsed/max*100:0)+'%';if(session.status==='running'&&elapsed>=max){$('phase').textContent='COMPLETE';$('clock').textContent='00:00'}}
async function boot(){await sync();subscription=db.channel('dhfc-player').on('postgres_changes',{event:'*',schema:'public',table:'dhfc_sessions'},()=>sync()).subscribe();setInterval(draw,100);setInterval(sync,5000);draw()}boot();
</script></body></html>
