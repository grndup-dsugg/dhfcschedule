<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DHFC | Upper Body Timer v4</title><style>
:root{--red:#A33835;--cream:#F3EDE1;--muted:#BEB5AA;--bg:#0b0b0b}*{box-sizing:border-box}html,body{margin:0;height:100%;width:100%;background:var(--bg);color:var(--cream);font-family:Arial,Helvetica,sans-serif}body{display:flex;flex-direction:column;overflow:hidden}header{height:16%;min-height:75px;display:flex;justify-content:space-between;align-items:center;padding:2vh 4vw;border-bottom:3px solid var(--red)}.brand{font-size:clamp(17px,2.5vw,48px);font-weight:900;line-height:.96;letter-spacing:.05em}.brand small{display:block;color:var(--muted);font-size:.35em;letter-spacing:.22em;margin-top:1em}.right{font-weight:800;color:var(--muted);font-size:clamp(12px,1.4vw,25px);text-align:right}main{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1vh 3vw}.label{font-size:clamp(28px,6.5vw,116px);font-weight:900;letter-spacing:.12em;color:var(--red);line-height:1.1;text-align:center}.time{font-size:min(31vw,39vh);line-height:1.1;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.055em}.exercise{font-size:clamp(16px,2.7vw,46px);font-weight:800;text-align:center;min-height:1.5em}.meta{display:flex;gap:3vw;justify-content:center;margin-top:1vh;color:var(--muted);font-size:clamp(13px,1.5vw,27px);font-weight:800}.meta strong{color:var(--cream)}.progress{height:1.6vh;background:#292929}.fill{height:100%;background:var(--red);width:0}footer{min-height:9%;display:flex;align-items:center;justify-content:space-between;padding:1vh 4vw;font-weight:800;letter-spacing:.09em;font-size:clamp(12px,1.25vw,23px)}.controls{display:flex;gap:1vw}button{background:#252525;border:1px solid #555;color:var(--cream);padding:.6em 1em;border-radius:6px;font-size:clamp(12px,1.2vw,22px);font-weight:800;cursor:pointer}button:focus{outline:3px solid var(--red)}.sub{font-size:.75em;color:var(--muted)}@media(max-width:680px){.right,.sub{display:none}header{min-height:65px}.meta{gap:3vw}footer{min-height:65px}}
</style></head><body><header><div class="brand">DOWNTOWN<br>HYBRID FITNESS CLUB<small>EVANSVILLE, INDIANA</small></div><div class="right" id="workoutName">WORKOUT TIMER</div></header><main><div class="label" id="label">GET READY</div><div class="time" id="time">00:10</div><div class="exercise" id="exercise"></div><div class="meta"><div>EXERCISE <strong id="exerciseNumber">1 / 3</strong></div><div>ROUND <strong id="round">1 / 3</strong></div><div>STATION <strong id="station">1 / 5</strong></div><div>NEXT <strong id="next">WORK</strong></div></div></main><div class="progress"><div class="fill" id="fill"></div></div><footer><div>DHFC <span class="sub">· TRAIN WITH PURPOSE</span></div><div class="controls"><button id="toggle">PAUSE</button><button id="skip">SKIP</button><button id="restart">RESTART</button></div></footer><script>
(()=>{'use strict';
// Five stations, three rounds per station, three exercises per round.
// Each exercise is 10s WORK + 5s REST, including the final exercise of every station.
// Between stations only, an additional 30s STATION BREAK follows that final 5s REST.
const DEFAULT={name:'UPPER BODY',ready:10,stations:5,rounds:3,exercises:3,work:10,rest:5,stationBreak:30,loop:false};
const $=id=>document.getElementById(id);
const num=(v,fallback,min,max)=>{const n=Number(v);return Number.isFinite(n)?Math.min(max,Math.max(min,Math.floor(n))):fallback};
let cfg={...DEFAULT};
try{
 const q=new URLSearchParams(location.search);
 if(q.has('config')){const c=JSON.parse(q.get('config'));if(!c||typeof c!=='object'||Array.isArray(c))throw Error('Invalid config');cfg={...cfg,...c}}
 for(const key of ['ready','stations','rounds','exercises','work','rest','stationBreak'])if(q.has(key))cfg[key]=q.get(key);
 if(q.has('name'))cfg.name=q.get('name');if(q.has('loop'))cfg.loop=q.get('loop')==='1';
}catch(e){console.warn('Using default workout',e)}
for(const [key,min,max] of [['ready',0,600],['stations',1,20],['rounds',1,30],['exercises',1,30],['work',1,3600],['rest',0,3600],['stationBreak',0,3600]])cfg[key]=num(cfg[key],DEFAULT[key],min,max);
const segments=[];
const add=(label,duration,station,round,exercise,color)=>{if(duration>0)segments.push({label,duration,station,round,exercise,color})};
add('GET READY',cfg.ready,1,1,1,'#F3EDE1');
for(let station=1;station<=cfg.stations;station++){
 for(let round=1;round<=cfg.rounds;round++){
  for(let exercise=1;exercise<=cfg.exercises;exercise++){
   add('WORK',cfg.work,station,round,exercise,'#A33835');
   add('REST',cfg.rest,station,round,exercise,'#F3EDE1');
  }
 }
 if(station<cfg.stations)add('STATION BREAK',cfg.stationBreak,station, cfg.rounds,cfg.exercises,'#F3EDE1');
}
segments.push({label:'COMPLETE',duration:0,station:cfg.stations,round:cfg.rounds,exercise:cfg.exercises,color:'#F3EDE1'});
let index=0,paused=false,remainingMs=segments[0].duration*1000,endsAt=performance.now()+remainingMs,completedAt=0;
const fmt=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
function advance(at){index=Math.min(index+1,segments.length-1);remainingMs=segments[index].duration*1000;endsAt=at+remainingMs;if(index===segments.length-1)completedAt=at}
function render(){
 const s=segments[index],seconds=Math.ceil(Math.max(0,remainingMs)/1000);
 $('label').textContent=paused?'PAUSED':s.label;
 $('label').style.color=s.color;
 $('time').textContent=fmt(seconds);
 $('exercise').textContent=s.label==='STATION BREAK'?'RECOVER FOR THE NEXT STATION':s.label==='COMPLETE'?'GREAT WORK':'';
 $('exerciseNumber').textContent=`${s.exercise} / ${cfg.exercises}`;
 $('round').textContent=`${s.round} / ${cfg.rounds}`;
 $('station').textContent=`${s.station} / ${cfg.stations}`;
 $('next').textContent=segments[index+1]?.label||'—';
 $('fill').style.width=`${s.duration?Math.min(100,Math.max(0,(1-remainingMs/(s.duration*1000))*100)):100}%`;
 $('toggle').textContent=paused?'RESUME':'PAUSE';
 $('workoutName').textContent=String(cfg.name||'WORKOUT TIMER');
}
function restart(){index=0;paused=false;remainingMs=segments[0].duration*1000;endsAt=performance.now()+remainingMs;completedAt=0;render()}
function tick(now){
 if(!paused){
  if(index<segments.length-1){
   // Preserve elapsed time across frame delays and background throttling.
   while(index<segments.length-1&&now>=endsAt)advance(endsAt);
   remainingMs=index===segments.length-1?0:Math.max(0,endsAt-now);
  }else if(cfg.loop&&now-completedAt>=4000)restart();
 }
 render();requestAnimationFrame(tick);
}
$('toggle').onclick=()=>{
 if(index===segments.length-1)return;
 if(paused){paused=false;endsAt=performance.now()+remainingMs}
 else{remainingMs=Math.max(0,endsAt-performance.now());paused=true}
 render();
};
$('skip').onclick=()=>{
 if(index>=segments.length-1)return;
 advance(performance.now());
 if(paused)remainingMs=segments[index].duration*1000;
 render();
};
$('restart').onclick=restart;
document.addEventListener('keydown',e=>{
 if(e.key===' '){e.preventDefault();$('toggle').click()}
 if(e.key==='ArrowRight')$('skip').click();
 if(e.key.toLowerCase()==='r')restart();
});
// Phase 1: independent standalone timer. Shared TV sync and remote coach controls come later.
render();requestAnimationFrame(tick);
})();
</script></body></html>
